<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Example of a shared bill split chart</title>
<desc id="desc">A 120 dollar dinner paid by Alex. Alex's 40 dollar share is covered. Bo's 50 dollar share has 20 dollars recorded as paid and 30 dollars owed. Cam's 30 dollar share is owed. Total still owed is 60 dollars. This is a concept explainer, not a wireframe.</desc>
<defs>
  <pattern id="bo-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#CBD1F6"/><rect width="2" height="8" fill="#8794E7" opacity=".75"/></pattern>
  <pattern id="cam-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F5DEA4"/><rect width="2" height="8" fill="#D7A94B" opacity=".75"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#263247" flood-opacity=".12"/></filter>
</defs>
<rect width="800" height="400" fill="#F8F7F3"/>
<rect x="14" y="14" width="772" height="333" rx="24" fill="#FFFFFF" stroke="#ECEAE4"/>
<text x="40" y="49" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">HOW THE SPLIT READS</text>
<text x="40" y="70" fill="#677088" font-family="Arial, Helvetica, sans-serif" font-size="12">Slice size = share  ·  Solid = covered  ·  Stripes = still owed</text>
<g filter="url(#shadow)">
  <path d="M 210.000 79.000 A 126 126 0 0 1 319.119 268.000 L 273.220 241.500 A 73 73 0 0 0 210.000 132.000 Z" fill="#F27859"/>
  <path d="M 319.119 268.000 A 126 126 0 0 1 210.000 331.000 L 210.000 278.000 A 73 73 0 0 0 273.220 241.500 Z" fill="#6677D9"/>
  <path d="M 210.000 331.000 A 126 126 0 0 1 84.000 205.000 L 137.000 205.000 A 73 73 0 0 0 210.000 278.000 Z" fill="url(#bo-stripe)"/>
  <path d="M 84.000 205.000 A 126 126 0 0 1 210.000 79.000 L 210.000 132.000 A 73 73 0 0 0 137.000 205.000 Z" fill="url(#cam-stripe)"/>
</g>
<path d="M 210.000 79.000 A 126 126 0 0 1 319.119 268.000 L 273.220 241.500 A 73 73 0 0 0 210.000 132.000 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
<path d="M 319.119 268.000 A 126 126 0 0 1 84.000 205.000 L 137.000 205.000 A 73 73 0 0 0 273.220 241.500 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
<path d="M 84.000 205.000 A 126 126 0 0 1 210.000 79.000 L 210.000 132.000 A 73 73 0 0 0 137.000 205.000 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
<circle cx="210" cy="205" r="69" fill="#FFFFFF"/>
<text x="210" y="198" text-anchor="middle" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">$60</text>
<text x="210" y="220" text-anchor="middle" fill="#5B637B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">STILL OWED</text>
<text x="418" y="59" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Friday dinner</text>
<text x="418" y="81" fill="#5B637B" font-family="Arial, Helvetica, sans-serif" font-size="14">$120 total  ·  Alex paid upfront</text>
<line x1="418" y1="103" x2="751" y2="103" stroke="#E9E9EE"/>
<circle cx="431" cy="132" r="7" fill="#F27859"/>
<text x="450" y="137" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Alex</text>
<text x="751" y="136" text-anchor="end" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Share $40</text>
<text x="450" y="157" fill="#687188" font-family="Arial, Helvetica, sans-serif" font-size="12">Covered by upfront payment</text>
<text x="751" y="157" text-anchor="end" fill="#39715A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Owes $0</text>
<line x1="418" y1="176" x2="751" y2="176" stroke="#E9E9EE"/>
<circle cx="431" cy="204" r="7" fill="#6677D9"/>
<text x="450" y="209" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Bo</text>
<text x="751" y="208" text-anchor="end" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Share $50</text>
<text x="450" y="229" fill="#687188" font-family="Arial, Helvetica, sans-serif" font-size="12">Recorded paid $20</text>
<text x="751" y="229" text-anchor="end" fill="#AC6134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Owes $30</text>
<line x1="418" y1="248" x2="751" y2="248" stroke="#E9E9EE"/>
<circle cx="431" cy="276" r="7" fill="#E3B44E"/>
<text x="450" y="281" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Cam</text>
<text x="751" y="280" text-anchor="end" fill="#20243B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Share $30</text>
<text x="450" y="301" fill="#687188" font-family="Arial, Helvetica, sans-serif" font-size="12">Recorded paid $0</text>
<text x="751" y="301" text-anchor="end" fill="#AC6134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Owes $30</text>
<text x="400" y="374" text-anchor="middle" fill="#6E7384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic">Concept explainer only — not a wireframe or final design.</text>
</svg>